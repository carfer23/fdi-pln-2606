[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fdi_pln_2606_p5"]
artifacts = [
    "main.py", "ner.py", "ner_train.py", "causal_llm.py", "causal_train.py",
    "transformer.py", "attention.py", "tokenizer.py", "utils.py", "ner_hypersearch.py",
]

[tool.hatch.build.targets.editable]
path = "."

[project]
name = "fdi-pln-2606-p5"
version = "0.1.0"
description = "Transformer LLM + NER sobre el corpus de Lewis Carroll"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "click>=8.1",
    "rich>=13.0",
    "torch",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]

[project.scripts]
fdi-pln-2606-p5 = "fdi_pln_2606_p5.cli:cli"
