[project]
name = "fdi-pln-2606-p1"
version = "2.0"
description = "Agente IA para la práctica 1"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Carmen Fernández", email = "carfer23@ucm.es" },
    { name = "Yushan Yang", email = "yushyang@ucm.es" },
]
dependencies = [
    "loguru>=0.7.3",
    "ollama>=0.6.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "rich>=15.0.0",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[project.scripts]
fdi-pln-2606-p1 = "src.main:main"
