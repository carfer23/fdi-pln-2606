[project]
name = "fdi-pln-2606-p5"
version = "0.1.0"
description = "Transformer LLM + NER sobre el corpus de Lewis Carroll"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "loguru>=0.7.3",
    "click>=8.1",
    "rich>=13.0",
    "torch",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]

[project.scripts]
transformer = "main:cli"
